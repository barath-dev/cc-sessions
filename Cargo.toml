[package]
name = "paddock"
version = "2.8.0"
edition = "2021"
license = "MIT"
description = "Paddock: every Claude Code and Codex session on your machine, in one place. See, close and resume them across every account."
repository = "https://github.com/barath-dev/paddock"

[[bin]]
name = "paddock"
path = "src/main.rs"

# Stand-in for the real `claude` command, used only by the tests.
[[bin]]
name = "fake-claude"
path = "tests/support/fake_claude.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
tiny_http = "0.12"
getrandom = "0.3"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
