name: Release

# Pushing a tag like v2.0.0 builds the program for every system and publishes
# a release with the files the installers download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: cc-sessions-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: cc-sessions-macos-x86_64 }
          # Linux builds are statically linked (musl), so they run on any distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: cc-sessions-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: cc-sessions-linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: cc-sessions-windows-x86_64.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, asset: cc-sessions-windows-arm64.exe }
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          # No Visual C++ runtime needed on the PC that installs it.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --release --bin cc-sessions --target ${{ matrix.target }}
          mkdir out
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/cc-sessions$ext" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum cc-sessions-* > checksums.txt && cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
